<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Hệ Thống Học HSK 1-2-3-4</title>
<style>
  :root {
    --bg: #0b1120;
    --panel: #1e293b;
    --panel-hover: #283548;
    --border: #334155;
    --text: #f8fafc;
    --muted: #94a3b8;
    --primary: #e11d48;
    --accent: #f59e0b;
    --success: #10b981;
    --kaiti: "KaiTi", "STKaiti", "Kaiti SC", "DFKai-SB", "BiauKai", "AR PL UKai CN", "Songti SC", serif;
    --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
    --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body {
    height: 100dvh; width: 100%; overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--text);
  }
  .kaiti {
    font-family: var(--kaiti);
    font-weight: 500;
    letter-spacing: 1px;
  }

  /* ================= KEYFRAMES HOẠT ẢNH ================= */
  @keyframes slideInRight {
    from { opacity: 0; transform: translate3d(36px, 0, 0); }
    to   { opacity: 1; transform: translate3d(0, 0, 0); }
  }
  @keyframes slideInLeft {
    from { opacity: 0; transform: translate3d(-36px, 0, 0); }
    to   { opacity: 1; transform: translate3d(0, 0, 0); }
  }
  @keyframes cascadeUp {
    from { opacity: 0; transform: translate3d(0, 14px, 0) scale(0.985); }
    to   { opacity: 1; transform: translate3d(0, 0, 0) scale(1); }
  }
  @keyframes popScale {
    0%   { transform: scale(1); }
    40%  { transform: scale(1.28); }
    75%  { transform: scale(0.92); }
    100% { transform: scale(1); }
  }
  @keyframes pulseWave {
    0%   { box-shadow: 0 0 0 0 rgba(245, 158, 11, 0.65); }
    70%  { box-shadow: 0 0 0 10px rgba(245, 158, 11, 0); }
    100% { box-shadow: 0 0 0 0 rgba(245, 158, 11, 0); }
  }
  @keyframes shakeWrong {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-8px); }
    50% { transform: translateX(8px); }
    75% { transform: translateX(-5px); }
  }

  .anim-forward { animation: slideInRight 0.32s var(--ease-out) forwards; }
  .anim-back    { animation: slideInLeft 0.32s var(--ease-out) forwards; }
  .stagger-item {
    opacity: 0;
    animation: cascadeUp 0.36s var(--ease-out) forwards;
    animation-delay: calc(var(--i, 0) * 28ms);
  }
  .pop-anim   { animation: popScale 0.38s var(--ease-spring); }
  .pulse-anim { animation: pulseWave 0.8s ease-out; border-color: var(--accent) !important; }
  .shake-anim { animation: shakeWrong 0.35s ease-in-out; }

  /* ================= KHUNG BỐ CỤC CỐ ĐỊNH ================= */
  .app-shell {
    max-width: 760px; height: 100dvh; margin: 0 auto;
    display: flex; flex-direction: column;
    border-left: 1px solid var(--border); border-right: 1px solid var(--border);
    background: var(--bg); position: relative;
  }

  .topbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 16px; background: rgba(30, 41, 59, 0.92);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--border); flex-shrink: 0; gap: 10px; z-index: 10;
  }
  .topbar-left { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .back-btn {
    background: #0f172a; color: var(--text); border: 1px solid var(--border);
    padding: 7px 12px; border-radius: 9px; font-weight: 600; font-size: 0.84rem;
    cursor: pointer; white-space: nowrap;
    transition: transform 0.18s var(--ease-spring), background 0.18s, border-color 0.18s;
  }
  .back-btn:hover { background: var(--panel-hover); border-color: var(--accent); }
  .back-btn:active { transform: scale(0.91); }
  .screen-title {
    font-size: 0.98rem; font-weight: 800; color: #fff;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }

  .subbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 8px 16px; background: #111a2e; border-bottom: 1px solid var(--border);
    gap: 8px; flex-shrink: 0; flex-wrap: wrap;
    transition: all 0.25s var(--ease-out);
  }

  .viewport {
    flex: 1; overflow-y: auto; overflow-x: hidden; padding: 14px 16px;
    display: flex; flex-direction: column; gap: 10px;
    scroll-behavior: smooth;
  }

  /* ================= THẺ ĐIỀU HƯỚNG (MÀN 1, 2, 3) ================= */
  .nav-card {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 13px; padding: 14px 16px;
    display: flex; align-items: center; justify-content: space-between;
    cursor: pointer; gap: 12px; position: relative; overflow: hidden;
    transition: transform 0.22s var(--ease-spring), background 0.2s, border-color 0.2s, box-shadow 0.2s;
  }
  .nav-card:hover {
    background: var(--panel-hover); border-color: var(--accent);
    transform: translateY(-2px);
    box-shadow: 0 8px 20px -6px rgba(0, 0, 0, 0.45);
  }
  .nav-card:active { transform: scale(0.975); }
  .nav-card-left { display: flex; align-items: center; gap: 14px; min-width: 0; flex: 1; }
  .lvl-badge {
    width: 54px; height: 54px; border-radius: 13px;
    background: linear-gradient(135deg, #e11d48, #be123c); color: #fff;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-weight: 800; font-size: 0.82rem; flex-shrink: 0;
    box-shadow: 0 4px 12px rgba(225, 29, 72, 0.35);
    transition: transform 0.25s var(--ease-spring);
  }
  .nav-card:hover .lvl-badge { transform: scale(1.07) rotate(-2deg); }
  .lvl-badge span.zh { font-family: var(--kaiti); font-size: 1.2rem; font-weight: normal; }
  .nav-title { font-size: 1.02rem; font-weight: 700; color: #fff; margin-bottom: 3px; }
  .nav-sub { font-size: 0.8rem; color: var(--muted); }
  .arrow-box {
    color: var(--accent); font-weight: 800; font-size: 1.05rem;
    display: flex; align-items: center; gap: 8px; flex-shrink: 0;
  }
  .arrow-icon { transition: transform 0.22s var(--ease-spring); display: inline-block; }
  .nav-card:hover .arrow-icon { transform: translateX(5px); }

  /* Thanh tiến độ nhỏ trên thẻ */
  .prog-wrap {
    width: 72px; text-align: right;
  }
  .count-pill {
    background: #0b1120; border: 1px solid var(--border);
    color: var(--muted); font-size: 0.73rem; padding: 2px 8px; border-radius: 99px;
    display: inline-block; margin-bottom: 4px;
  }
  .prog-bar {
    height: 4px; width: 100%; background: #0b1120; border-radius: 99px; overflow: hidden;
  }
  .prog-fill {
    height: 100%; background: var(--success); border-radius: 99px;
    transition: width 0.5s var(--ease-out);
  }

  /* ================= DÒNG TỪ VỰNG / CÂU MẪU GỌN ================= */
  .item-row {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 11px; padding: 10px 14px;
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    transition: transform 0.2s var(--ease-out), background 0.25s, border-color 0.25s;
  }
  .item-row:hover { border-color: #475569; transform: translateX(3px); }
  .item-row.learned {
    border-color: rgba(16, 185, 129, 0.65);
    background: linear-gradient(90deg, rgba(16, 185, 129, 0.12), rgba(30, 41, 59, 0.95));
  }
  .row-main { display: flex; align-items: baseline; flex-wrap: wrap; gap: 10px; min-width: 0; flex: 1; }
  .row-stt { font-size: 0.78rem; color: var(--muted); min-width: 22px; }
  .row-hanzi { font-size: 1.8rem; color: #fff; line-height: 1.2; cursor: pointer; transition: color 0.15s; }
  .row-hanzi:hover { color: var(--accent); }
  .row-pinyin { font-size: 0.95rem; color: var(--accent); font-weight: 600; transition: opacity 0.2s; }
  .row-meaning { font-size: 0.9rem; color: #cbd5e1; transition: opacity 0.2s; }
  .row-actions { display: flex; gap: 6px; flex-shrink: 0; }

  /* ================= NÚT BẤM ĐÀN HỒI ================= */
  .btn {
    background: var(--panel-hover); color: #fff; border: 1px solid var(--border);
    padding: 6px 11px; border-radius: 8px; font-size: 0.8rem; font-weight: 600;
    cursor: pointer; display: inline-flex; align-items: center; gap: 5px;
    transition: transform 0.18s var(--ease-spring), background 0.18s, border-color 0.18s, box-shadow 0.18s;
  }
  .btn:hover { border-color: #64748b; }
  .btn:active { transform: scale(0.88); }
  .btn.active, .btn-primary {
    background: var(--primary); border-color: var(--primary);
    box-shadow: 0 3px 10px rgba(225, 29, 72, 0.35);
  }
  .btn-accent { background: var(--accent); color: #000; border-color: var(--accent); }
  .btn-success { background: var(--success); border-color: var(--success); }

  /* ================= FLASHCARD 3D THẬT (PERSPECTIVE FLIP) ================= */
  .fc-container {
    flex: 1; display: flex; flex-direction: column; justify-content: center;
    align-items: center; gap: 16px; padding: 8px 0;
  }
  .fc-scene {
    width: 100%; max-width: 460px; height: 260px;
    perspective: 1100px; cursor: pointer; user-select: none;
  }
  .fc-card-3d {
    width: 100%; height: 100%; position: relative;
    transform-style: preserve-3d;
    transition: transform 0.56s var(--ease-spring);
  }
  .fc-card-3d.is-flipped {
    transform: rotateY(180deg);
  }
  .fc-face {
    position: absolute; inset: 0;
    backface-visibility: hidden; -webkit-backface-visibility: hidden;
    background: linear-gradient(145deg, #1e293b, #151e2e);
    border: 2px solid var(--border); border-radius: 18px;
    padding: 24px; display: flex; flex-direction: column;
    justify-content: center; align-items: center; text-align: center;
    box-shadow: 0 14px 30px -8px rgba(0, 0, 0, 0.55);
    transition: border-color 0.25s;
  }
  .fc-scene:hover .fc-face { border-color: var(--accent); }
  .fc-face-back {
    transform: rotateY(180deg);
    background: linear-gradient(145deg, #17253b, #0f172a);
    border-color: var(--accent);
  }
  .fc-zh { font-size: 4rem; color: #fff; margin-bottom: 8px; line-height: 1.2; }
  .fc-py { font-size: 1.45rem; color: var(--accent); font-weight: 700; margin-bottom: 8px; }
  .fc-vi { font-size: 1.1rem; color: #e2e8f0; line-height: 1.4; }
  .fc-hint { font-size: 0.78rem; color: var(--muted); margin-top: 10px; opacity: 0.8; }

  /* ================= ACCORDION NGỮ PHÁP TRƯỢT MƯỢT ================= */
  .acc-item {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 11px; overflow: hidden; flex-shrink: 0;
    transition: border-color 0.25s, box-shadow 0.25s;
  }
  .acc-item.open {
    border-color: var(--accent);
    box-shadow: 0 6px 18px rgba(0, 0, 0, 0.35);
  }
  .acc-header {
    padding: 13px 15px; display: flex; justify-content: space-between;
    align-items: center; cursor: pointer; font-weight: 700; font-size: 0.94rem;
    transition: background 0.2s;
  }
  .acc-header:hover { background: var(--panel-hover); }
  .acc-chevron {
    transition: transform 0.3s var(--ease-spring);
    color: var(--accent); font-size: 0.85rem;
  }
  .acc-item.open .acc-chevron { transform: rotate(180deg); }

  /* Hiệu ứng trượt mở bằng CSS Grid 0fr -> 1fr */
  .acc-grid {
    display: grid; grid-template-rows: 0fr;
    transition: grid-template-rows 0.32s var(--ease-out);
    background: #121b2e;
  }
  .acc-item.open .acc-grid { grid-template-rows: 1fr; }
  .acc-inner { overflow: hidden; }
  .acc-body {
    padding: 12px 15px; border-top: 1px solid var(--border);
    font-size: 0.88rem;
  }
  .formula-box {
    background: #0b1120; color: var(--accent); padding: 8px 12px;
    border-radius: 7px; font-weight: 700; margin-bottom: 8px;
    border-left: 3px solid var(--primary);
  }

  .search-input {
    flex: 1; background: #0b1120; border: 1px solid var(--border);
    color: #fff; padding: 8px 12px; border-radius: 9px; font-size: 0.85rem; outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  .search-input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.18);
  }

  /* ================= MODAL MỜ KÍNH & PHÓNG MƯỢT ================= */
  .modal-backdrop {
    position: fixed; inset: 0; background: rgba(6, 10, 20, 0.78);
    backdrop-filter: blur(6px); z-index: 99;
    display: flex; align-items: center; justify-content: center; padding: 16px;
    opacity: 0; pointer-events: none;
    transition: opacity 0.25s var(--ease-out);
  }
  .modal-backdrop.show { opacity: 1; pointer-events: auto; }
  .modal-box {
    background: var(--panel); border: 1px solid var(--border); border-radius: 16px;
    width: 100%; max-width: 620px; padding: 18px; max-height: 90dvh;
    display: flex; flex-direction: column; gap: 10px;
    transform: scale(0.92) translateY(12px);
    transition: transform 0.3s var(--ease-spring);
    box-shadow: 0 20px 40px rgba(0,0,0,0.6);
  }
  .modal-backdrop.show .modal-box { transform: scale(1) translateY(0); }
  textarea.paste-area {
    width: 100%; height: 180px; background: #0b1120; color: #fff;
    border: 1px solid var(--border); border-radius: 9px; padding: 10px;
    font-size: 0.8rem; font-family: monospace; resize: none; outline: none;
  }
  textarea.paste-area:focus { border-color: var(--accent); }
</style>
</head>
<body>

<div class="app-shell">
  <header class="topbar">
    <div class="topbar-left">
      <button class="back-btn" id="btnBack" style="display:none" onclick="goBack()">← Quay lại</button>
      <div class="screen-title" id="screenTitle">HỆ THỐNG HỌC HSK 1–2–3–4</div>
    </div>
    <div style="display:flex; gap:6px; flex-shrink:0;">
      <button class="btn btn-accent" onclick="openModal()">⚡ Nạp PDF</button>
      <button class="btn" onclick="exportJSON()" title="Xuất dữ liệu">💾</button>
    </div>
  </header>

  <div class="subbar" id="subBar" style="display:none"></div>

  <main class="viewport" id="mainViewport"></main>
</div>

<!-- Modal Nạp toàn bộ 87 trang PDF -->
<div class="modal-backdrop" id="importModal">
  <div class="modal-box">
    <div style="font-weight:800; font-size:1rem;">⚡ Nạp toàn bộ 87 trang PDF vào App</div>
    <div style="font-size:0.82rem; color:var(--muted); line-height:1.45;">
      1. Mở file PDF <b>TỔNG HỢP TÀI LIỆU & LỘ TRÌNH HỌC HSK 1-2-3-4</b>.<br>
      2. Nhấn <b>Ctrl + A</b> rồi <b>Ctrl + C</b> để sao chép toàn bộ 87 trang.<br>
      3. Dán (<b>Ctrl + V</b>) vào ô dưới đây và bấm <b>Phân tích & Lưu</b>.
    </div>
    <textarea id="pdfInput" class="paste-area" placeholder="Dán toàn bộ nội dung Ctrl+A từ file PDF vào đây..."></textarea>
    <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px;">
      <label class="btn" style="cursor:pointer;">
        📂 Nạp từ file .JSON
        <input type="file" accept=".json" style="display:none" onchange="importJSON(event)">
      </label>
      <div style="display:flex; gap:8px;">
        <button class="btn" onclick="closeModal()">Đóng</button>
        <button class="btn btn-primary" onclick="parsePDFContent()">🚀 Phân tích & Lưu</button>
      </div>
    </div>
    <div id="importMsg" style="font-size:0.82rem; color:var(--success); font-weight:600;"></div>
  </div>
</div>

<script>
// ================= THÔNG TIN CẤU TRÚC 4 CẤP ĐỘ TỪ TÀI LIỆU =================
const HSK_META = {
  1: {
    name: "HSK 1", zh: "一级", subtitle: "Nền tảng Pinyin & Sơ cấp",
    desc: "150 từ (+6 bổ sung) • 15 Chủ đề • 12 Ngữ pháp • 30 Câu • 4 Tuần",
    exam: "40 câu (~40 phút): Nghe 20 câu + Đọc 20 câu (Đề thi có Pinyin kèm, không thi Viết). Điểm đạt: 120/200.",
    weeks: [
      {w: "Chương 0 — Pinyin & Biến điệu", d: "4 thanh điệu (ā, á, ǎ, à). Biến điệu 不 (trước thanh 4 đổi thành bú: 不是 bú shì). Biến điệu 一 (trước thanh 4 thành yí: 一个; trước thanh 1/2/3 thành yì: 一本书). Hai thanh 3 liền nhau đổi thanh đầu thành thanh 2 (你好 ní hǎo). Sau j/q/x/y bỏ hai chấm trên ü (去 qù)."},
      {w: "Tuần 1 — Pinyin & 30 từ đầu", d: "Ngày 1–4: Luyện 21 phụ âm, 6 nguyên âm, 4 thanh điệu. Ngày 5–7: Học Đại từ (7), Số đếm (10), Lời chào (6) và 7 từ cơ bản (是/有/在/不/很/的/我)."},
      {w: "Tuần 2 — Thời gian, Gia đình, Động từ", d: "Ngày 8–9: Thời gian (14 từ). Ngày 10–11: Gia đình & Người (12 từ) + sở hữu 的. Ngày 12–14: 15 Động từ cơ bản + câu hỏi 吗, phủ định 不."},
      {w: "Tuần 3 — Địa điểm, Đồ vật, Tính từ", d: "Ngày 15–16: Địa điểm (7) + Vị trí (5). Ngày 17–18: Đồ vật (18) + Thực phẩm (8). Ngày 19–21: Tính từ (9), Lượng từ (6), Từ để hỏi (8)."},
      {w: "Tuần 4 — Tổng ôn & Luyện đề", d: "Ngày 22–28: Mỗi ngày làm 1 đề mẫu 40 phút, ôn 150 từ vựng, 12 điểm ngữ pháp và phản xạ 30 câu giao tiếp."}
    ],
    tips: "Tuần 1 chỉ tập trung Pinyin & thanh điệu. Học từ theo cặp đối lập (大↔小, 多↔少, 冷↔热, 上↔下). Tận dụng tối đa Pinyin đi kèm trong đề thi HSK 1."
  },
  2: {
    name: "HSK 2", zh: "二级", subtitle: "Giao tiếp cơ bản",
    desc: "151 từ mới (+11 bổ sung) • 12 Chủ đề • 15 Ngữ pháp • 30 Câu • 4 Tuần",
    exam: "60 câu (~55 phút): Nghe 35 câu (~20 phút) + Đọc 25 câu (~25 phút). Điểm đạt: 120/200.",
    weeks: [
      {w: "Tuần 1 — Ôn HSK 1 + Người, Thời gian, Số", d: "Ôn 150 từ HSK 1. Học Đại từ & Con người (15 từ), Thời gian & Tần suất (12 từ), Số đếm trăm/nghìn & Lượng từ (7 từ)."},
      {w: "Tuần 2 — Động từ & Tính từ cốt lõi", d: "Học 37 Động từ thông dụng (sinh hoạt, thể thao, cảm nghĩ) và 21 Tính từ mô tả (nhanh/chậm, đắt/rẻ, màu sắc, thời tiết)."},
      {w: "Tuần 3 — Địa điểm, Đồ vật, Câu so sánh", d: "Học Địa điểm & Hướng đi (11 từ), Đồ vật & Giao thông (15 từ), Thực phẩm (7 từ), Cơ thể (5 từ). Ngữ pháp: 比, 得, 着, 从…到…"},
      {w: "Tuần 4 — Luyện đề & Tổng ôn", d: "Làm đề thi mẫu 55 phút/đề. Ôn kỹ 151 từ mới, phân biệt 再/又/还 và luyện nói trôi chảy 30 câu mẫu."}
    ],
    tips: "Học từ theo cụm (ví dụ: 帮助我 thay vì chỉ học 帮助). Chú ý nghe kỹ các con số (giờ giấc, giá tiền, ngày tháng) vì rất dễ nhầm thanh 2 và thanh 3."
  },
  3: {
    name: "HSK 3", zh: "三级", subtitle: "Trung cấp sơ bộ (Có phần Viết)",
    desc: "300 từ mới (Tích lũy 600 từ) • 14 Chủ đề • 15 Ngữ pháp • 30 Câu • 6 Tuần",
    exam: "80 câu (~90 phút): Nghe 40 câu + Đọc 30 câu + Viết 10 câu. KHÔNG còn Pinyin kèm. Điểm đạt: 180/300.",

function speak(text, btnEl) {
  if (btnEl) {
    btnEl.classList.remove('pulse-anim');
    void btnEl.offsetWidth;
    btnEl.classList.add('pulse-anim');
  }
  if (!('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'zh-CN';
  u.rate = 0.88;
  window.speechSynthesis.speak(u);
}

// Chuyển màn hình kèm hiệu ứng trượt hướng (forward = phải sang, back = trái sang)
function navigateTo(screen, patch = {}, dir = 'forward') {
  Object.assign(navState, patch);
  navState.screen = screen;
  render(dir);
}

function goBack() {
  if (navState.screen === 'VOCAB_DETAIL') {
    navigateTo('TOPICS', { mode: 'list' }, 'back');
  } else if (['TOPICS', 'GRAMMAR', 'SENTENCES', 'ROADMAP'].includes(navState.screen)) {
    navigateTo('MODULES', { mode: 'list' }, 'back');
  } else if (navState.screen === 'MODULES') {
    navigateTo('LEVELS', {}, 'back');
  }
}

function triggerViewportAnim(dir) {
  const vp = document.getElementById('mainViewport');
  if (!dir) return;
  vp.classList.remove('anim-forward', 'anim-back');
  void vp.offsetWidth;
  vp.classList.add(dir === 'back' ? 'anim-back' : 'anim-forward');
  vp.scrollTop = 0;
}

function render(dir = null) {
  const btnBack = document.getElementById('btnBack');
  const titleEl = document.getElementById('screenTitle');
  const subBar = document.getElementById('subBar');
  const vp = document.getElementById('mainViewport');

  subBar.style.display = 'none';
  subBar.innerHTML = '';

  if (navState.screen === 'LEVELS') {
    btnBack.style.display = 'none';
    titleEl.textContent = 'CHỌN CẤP ĐỘ HSK';
    renderLevelsScreen(vp);
  }
  else if (navState.screen === 'MODULES') {
    btnBack.style.display = 'inline-block';
    titleEl.textContent = `CHƯƠNG TRÌNH HSK ${navState.level}`;
    renderModulesScreen(vp);
  }
  else if (navState.screen === 'TOPICS') {
    btnBack.style.display = 'inline-block';
    titleEl.textContent = `TỪ VỰNG HSK ${navState.level} THEO CHỦ ĐỀ`;
    renderTopicsScreen(vp, subBar);
  }
  else if (navState.screen === 'VOCAB_DETAIL') {
    btnBack.style.display = 'inline-block';
    titleEl.textContent = `HSK ${navState.level} • ${navState.topic}`;
    renderVocabDetailScreen(vp, subBar);
  }
  else if (navState.screen === 'GRAMMAR') {
    btnBack.style.display = 'inline-block';
    titleEl.textContent = `NGỮ PHÁP TRỌNG TÂM HSK ${navState.level}`;
    renderGrammarScreen(vp);
  }
  else if (navState.screen === 'SENTENCES') {
    btnBack.style.display = 'inline-block';
    titleEl.textContent = `30 MẪU CÂU GIAO TIẾP HSK ${navState.level}`;
    renderSentencesScreen(vp, subBar);
  }
  else if (navState.screen === 'ROADMAP') {
    btnBack.style.display = 'inline-block';
    titleEl.textContent = `LỘ TRÌNH & MẸO THI HSK ${navState.level}`;
    renderRoadmapScreen(vp);
  }

  triggerViewportAnim(dir);
}

function renderTopicsScreen(vp, subBar) {

function renderTopicsBody() {
  const vp = document.getElementById('mainViewport');
  const lvl = navState.level;
  const vList = db.vocab.filter(x => x.level === lvl);

  if (navState.search.trim()) {
    const q = navState.search.trim().toLowerCase();
    const matched = vList.filter(x =>
      x.hanzi.includes(q) || x.pinyin.toLowerCase().includes(q) || x.meaning.toLowerCase().includes(q)
    );
    vp.innerHTML = matched.length ? matched.map((v, i) => renderVocabRowHTML(v, i)).join('') :
      `<div style="text-align:center; color:var(--muted); padding:30px;">Không tìm thấy từ phù hợp.</div>`;
    return;
  }

  const topics = [...new Set(vList.map(x => x.topic))];
  vp.innerHTML = topics.map((t, idx) => {
    const items = vList.filter(x => x.topic === t);
    const done = items.filter(x => learned[`v_${lvl}_${x.hanzi}`]).length;
    const pct = items.length ? Math.round((done / items.length) * 100) : 0;
    return `
      <div class="nav-card stagger-item" style="--i:${idx}" onclick="openTopicDetail('${t.replace(/'/g, "\\'")}')">

}

      <div class="fc-container stagger-item">
        <div style="color:var(--muted); font-size:0.85rem;">Từ <b>${navState.fcIndex + 1} / ${items.length}</b> (${cur.topic})</div>
        <div class="fc-scene" id="fcScene" onclick="flip3DCard()">

              <div class="fc-zh kaiti">${cur.hanzi}</div>
              <div class="fc-hint">👆 Chạm vào thẻ để xoay 3D xem Pinyin & Nghĩa</div>
            </div>

              <div class="fc-zh kaiti" style="font-size:2.9rem;">${cur.hanzi}</div>
              <div class="fc-py">${cur.pinyin}</div>
              <div class="fc-vi">${cur.meaning}</div>
            </div>

        <div style="display:flex; gap:8px; flex-wrap:wrap; justify-content:center;">
          <button class="btn" onclick="stepFlashcard(-1, ${items.length})">⬅ Trước</button>
          <button class="btn btn-accent" onclick="speak('${cur.hanzi}', this)">🔊 Đọc</button>
          <button class="btn ${isDone?'btn-success':''}" onclick="toggleMark('${key}', this)">${isDone?'✓ Đã thuộc':'Đánh dấu'}</button>
          <button class="btn btn-primary" onclick="stepFlashcard(1, ${items.length})">Tiếp ➡</button>
        </div>
      </div>
    `;
  }
  else if (navState.mode === 'quiz') {
    const pool = db.vocab.filter(x => x.level === navState.level);
    const target = items[Math.floor(Math.random() * items.length)];
    const distractors = pool.filter(x => x.hanzi !== target.hanzi).sort(() => 0.5 - Math.random()).slice(0, 3);
    const opts = [target, ...distractors].sort(() => 0.5 - Math.random());

function switchSubMode(m) {
  navState.mode = m;
  navState.fcFlipped = false;
  render('forward');
}

// Lật thẻ 3D trực tiếp trên DOM (không vẽ lại toàn trang nên cực mượt)
function flip3DCard() {
  navState.fcFlipped = !navState.fcFlipped;
  const card = document.getElementById('fcCard3D');
  if (card) card.classList.toggle('is-flipped', navState.fcFlipped);
}

function stepFlashcard(delta, total) {
  navState.fcIndex = (navState.fcIndex + delta + total) % total;
  navState.fcFlipped = false;
  render(delta > 0 ? 'forward' : 'back');
}

function renderVocabRowHTML(v, idx = 0) {
  const key = `v_${v.level}_${v.hanzi}`;
  const isDone = !!learned[key];
  const delayIdx = Math.min(idx, 18);
  return `
    <div class="item-row stagger-item ${isDone ? 'learned' : ''}" style="--i:${delayIdx}" id="row_${key}">
      <div class="row-main">
        <span class="row-stt">${v.stt}.</span>
        <span class="row-hanzi kaiti" onclick="speak('${v.hanzi}')" title="Chạm để nghe">${v.hanzi}</span>
        ${navState.showPinyin ? `<span class="row-pinyin">${v.pinyin}</span>` : ''}
        ${navState.showMeaning ? `<span class="row-meaning">— ${v.meaning}</span>` : ''}
      </div>
      <div class="row-actions">
        <button class="btn" onclick="speak('${v.hanzi}', this)">🔊</button>
        <button class="btn ${isDone ? 'btn-success' : ''}" onclick="toggleMark('${key}', this)">${isDone ? '✓' : '○'}</button>
      </div>
    </div>
  `;
}

function handleQuizChoice(btn, correct, hanzi) {
  speak(hanzi);
  if (correct) {
    btn.classList.add('btn-success', 'pop-anim');
    setTimeout(() => render('forward'), 520);
  } else {
    btn.classList.add('btn-primary', 'shake-anim');
  }
}

// Đánh dấu thuộc ngay trên phần tử mà không giật lại toàn bộ danh sách
function toggleMark(key, btnEl) {
  const nowLearned = !learned[key];
  if (nowLearned) learned[key] = true;
  else delete learned[key];
  saveDB();

  if (btnEl) {
    btnEl.classList.remove('pop-anim');
    void btnEl.offsetWidth;
    btnEl.classList.add('pop-anim');
    btnEl.classList.toggle('btn-success', nowLearned);
    if (btnEl.textContent === '✓' || btnEl.textContent === '○') {
      btnEl.textContent = nowLearned ? '✓' : '○';
    } else {
      btnEl.textContent = nowLearned ? '✓ Đã thuộc' : 'Đánh dấu';
    }
    const row = btnEl.closest('.item-row');
    if (row) row.classList.toggle('learned', nowLearned);
  } else {
    render();
  }
}

function toggleAccordion(id) {
  const el = document.getElementById('acc_' + id);

    el.classList.add('open');
    navState.openAccId = id;
  } else {
    navState.openAccId = '';

}

// ================= BỘ PHÂN TÍCH TỰ ĐỘNG 87 TRANG PDF =================
function openModal() { document.getElementById('importModal').classList.add('show'); }
function closeModal() { document.getElementById('importModal').classList.remove('show'); }

function parsePDFContent() {
  const raw = document.getElementById('pdfInput').value;
  if (!raw || raw.trim().length < 100) {
    alert("Hãy dán nội dung Ctrl+A từ file PDF vào ô trống!");
    return;
  }

  const lines = raw.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
  let curLevel = 1;
  let section = '';
  let curTopic = '3.1 Chủ đề';

  const vocabOut = [];
  const grammarOut = [];
  const sentBlocks = { 1: [], 2: [], 3: [], 4: [] };

  const topicRe = /^(3\.\d+\s+.+?)\s*\(\d+.*?\)$/;
  const vocabRe = /^(\d+)\s+([\u4e00-\u9fff]+)\s+([a-zA-ZāáǎàēéěèīíǐìōóǒòūúǔùǖǘǚǜüĀÁǍÀĒÉĚÈĪÍǏÌŌÓǑÒŪÚǓÙǕǗǙǛÜ'\s]+?)\s+(.+)$/;
  const grammarRe = /^4\.(\d+)\s+(.+)$/;

  let curG = null;
  let gField = '';

  for (let i = 0; i < lines.length; i++) {
    const line = lines[i];

    if (/PHẦN 1|Từ vựng HSK 1/i.test(line) && /HSK 1/i.test(line)) curLevel = 1;
    if (/PHẦN 2|Từ vựng HSK 2/i.test(line) && /HSK 2/i.test(line)) curLevel = 2;
    if (/PHẦN 3|Từ vựng HSK 3/i.test(line) && /HSK 3/i.test(line)) curLevel = 3;
    if (/PHẦN 4|Từ vựng HSK 4/i.test(line) && /HSK 4/i.test(line)) curLevel = 4;

    if (/^Chương 3\s*[—\-–]?\s*Từ vựng HSK (\d)/i.test(line)) {
      curLevel = parseInt(line.match(/HSK (\d)/i)[1]);
      section = 'vocab';
      continue;
    }
    if (/^Chương 4\s*[—\-–]?\s*Ngữ pháp trọng tâm HSK (\d)/i.test(line)) {
      if (curG) { grammarOut.push(curG); curG = null; }
      curLevel = parseInt(line.match(/HSK (\d)/i)[1]);
      section = 'grammar';
      continue;
    }
    if (/^Chương 5\s*[—\-–]?\s*30 câu mẫu/i.test(line)) {
      if (curG) { grammarOut.push(curG); curG = null; }
      section = 'sentences';
      continue;
    }
    if (/^Chương 6\s*[—\-–]?\s*Mẹo học/i.test(line)) {
      section = 'other';
      continue;
    }

    if (section === 'vocab') {
      const mt = line.match(topicRe);
      if (mt) { curTopic = mt[1].trim(); continue; }
      const mv = line.match(vocabRe);
      if (mv) {
        let meaning = mv[4].trim();
        while (i + 1 < lines.length) {
          const nxt = lines[i + 1];
          if (!/^\d+\s+[\u4e00-\u9fff]/.test(nxt) && !topicRe.test(nxt) && !nxt.startsWith('STT ') && !nxt.startsWith('Chương ')) {
            meaning += ' ' + nxt;
            i++;
          } else break;
        }
        vocabOut.push({
          level: curLevel,
          topic: curTopic,
          stt: parseInt(mv[1]),
          hanzi: mv[2].trim(),
          pinyin: mv[3].trim(),
          meaning: meaning
        });
      }
    }
    else if (section === 'grammar') {
      const mg = line.match(grammarRe);
      if (mg) {
        if (curG) grammarOut.push(curG);
        curG = { level: curLevel, id: '4.' + mg[1], title: mg[2].trim(), formula: '', example: '', explanation: '' };
        gField = '';
      } else if (curG) {
        if (line.startsWith('Công thức:')) { curG.formula = line.replace('Công thức:', '').trim(); gField = 'formula'; }
        else if (line.startsWith('Ví dụ:')) { curG.example = line.replace('Ví dụ:', '').trim(); gField = 'example'; }
        else if (line.startsWith('Giải thích:')) { curG.explanation = line.replace('Giải thích:', '').trim(); gField = 'explanation'; }
        else if (gField) { curG[gField] += ' ' + line; }
      }
    }
    else if (section === 'sentences') {
      if (line.startsWith('STT ') || line.startsWith('Học thuộc') || line.startsWith('và cả') || line.startsWith('30 câu') || line.startsWith('tiếng Việt') || line.startsWith('pinyin')) continue;
      sentBlocks[curLevel].push(line);
    }
  }
  if (curG) grammarOut.push(curG);

  const sentencesOut = [];
  [1, 2, 3, 4].forEach(lvl => {
    const joined = sentBlocks[lvl].join('\n');
    const parts = joined.split(/(?m)^(\d+)\s+(?=[\u4e00-\u9fff])/);
    for (let k = 1; k < parts.length; k += 2) {
      const stt = parseInt(parts[k]);
      const block = parts[k + 1].replace(/\s+/g, ' ').trim();
      const m = block.match(/^([\u4e00-\u9fff，。！？：、\s]+?)\s+([A-Za-z].*)$/);
      if (m) {
        const hanzi = m[1].replace(/\s+/g, '');
        const rest = m[2];
        const endCount = Math.max(1, (hanzi.match(/[。！？]/g) || []).length);
        const punctRegex = /[\.\!\?]\s+/g;
        let match, count = 0, splitIdx = -1;
        while ((match = punctRegex.exec(rest)) !== null) {
          count++;
          if (count === endCount) { splitIdx = punctRegex.lastIndex; break; }
        }
        const pinyin = splitIdx !== -1 ? rest.slice(0, splitIdx).trim() : rest;
        const meaning = splitIdx !== -1 ? rest.slice(splitIdx).trim() : '';
        sentencesOut.push({ level: lvl, stt, hanzi, pinyin, meaning });
      }
    }
  });

  if (vocabOut.length > 0) db.vocab = vocabOut;
  if (grammarOut.length > 0) db.grammar = grammarOut;
  if (sentencesOut.length > 0) db.sentences = sentencesOut;

  saveDB();
  render('forward');
  document.getElementById('importMsg').textContent =
    `✅ Đã nạp thành công: ${db.vocab.length} Từ vựng, ${db.grammar.length} Ngữ pháp và ${db.sentences.length} Câu mẫu!`;
}

function exportJSON() {
  const blob = new Blob([JSON.stringify(db, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'hsk_1_4_full_database.json';
  a.click();
}

function importJSON(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = evt => {
    try {
      const parsed = JSON.parse(evt.target.result);
      if (parsed.vocab) {
        db = parsed;
        saveDB();
        render('forward');
        closeModal();
      }
    } catch (err) { alert("File JSON không hợp lệ!"); }
  };
  reader.readAsText(file);
}

render('forward');
</script>
</body>
</html>
